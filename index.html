<!DOCTYPE html>

</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-red-100 selection:text-red-700">

    <!-- React Application Root -->

    <!-- React Application Logic -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 1. DATA CATALOG & CONSTANTS
        // ==========================================

            // Cheaper Staples
            { id: 1, name: '2L Pure Sunflower Oil', storeA: 64.99, storeB: 79.99, category: 'Cheaper Staples', unit: '2L Bottle', badge: 'Top Seller', desc: 'Triple-refined pure vegetable oil ideal for cooking and frying.' },
            { id: 2, name: '2kg Long Grain White Rice', storeA: 34.99, storeB: 42.99, category: 'Cheaper Staples', unit: '2kg Bag', badge: 'Best Value', desc: 'Fluffy long grain white rice, perfect everyday family meal staple.' },
            { id: 3, name: '10kg Super Maize Meal', storeA: 109.99, storeB: 129.99, category: 'Cheaper Staples', unit: '10kg Bag', badge: 'Bulk Deal', desc: 'Enriched super maize meal for hearty nutritious breakfasts and dinners.' },
            { id: 4, name: '5kg Cake Wheat Flour', storeA: 69.99, storeB: 84.99, category: 'Cheaper Staples', unit: '5kg Bag', badge: 'Essential', desc: 'Premium quality sifted wheat flour for home baking and bread making.' },
            
            // Fresh Harvest
            { id: 5, name: '2L Full Cream Fresh Milk', storeA: 29.99, storeB: 33.99, category: 'Fresh Harvest', unit: '2L Jug', badge: 'Farm Fresh', desc: 'Locally sourced pasteurised full cream milk packed with vitamins.' },

            { id: 7, name: '3kg Potato Pocket', storeA: 44.99, storeB: 59.99, category: 'Fresh Harvest', unit: '3kg Pocket', badge: 'Direct Farm', desc: 'Class 1 fresh potatoes ideal for roasting, boiling, or home fries.' },
            { id: 8, name: '1kg Fresh Carrots', storeA: 14.99, storeB: 19.99, category: 'Fresh Harvest', unit: '1kg Bag', badge: 'Vitamin Rich', desc: 'Sweet and crunchy orange carrots harvested daily.' },

            // Daily Bakery
            { id: 9, name: 'White Bread 700g', storeA: 15.99, storeB: 18.99, category: 'Daily Bakery', unit: '700g Loaf', badge: 'Baked Daily', desc: 'Soft sliced white sandwich bread baked fresh every morning.' },
            { id: 10, name: 'Brown Bread 700g', storeA: 14.99, storeB: 17.99, category: 'Daily Bakery', unit: '700g Loaf', badge: 'High Fibre', desc: 'Whole wheat brown bread loaf rich in natural dietary fibre.' },
            { id: 11, name: '6-Pack Fresh Butter Croissants', storeA: 34.99, storeB: 44.99, category: 'Daily Bakery', unit: '6 Pack', badge: 'Chef Special', desc: 'Flaky golden butter croissants crafted by our in-house master bakers.' },

            // Pay-Point Services
            { id: 12, name: 'Airtime & Data Voucher Top-Up', storeA: 0.00, storeB: 0.00, category: 'Pay-Point Services', unit: 'Instant Digital', badge: 'Zero Fee', desc: 'Instant till-point bill payments, electricity, and mobile airtime refills.' },
            { id: 13, name: 'Grocery Gift Savings Pass', storeA: 250.00, storeB: 250.00, category: 'Pay-Point Services', unit: 'Voucher', badge: 'Bonus 5%', desc: 'Preloaded shopping card with 5% extra bonus value on checkout.' }
        ];

        const TESTIMONIALS = [
            { id: 1, name: 'Sipho Ndlovu', role: 'Family Shopper', text: 'Pick n Cheaper has reduced my family’s monthly grocery expenditure by over R800. The Smart Basket calculator is spot on!', avatar: '👨‍👩‍👧' },
            { id: 2, name: 'Anneri van Zyl', role: 'Home Baker', text: 'The bakery quality is outstanding and the bulk staple prices beat every major chain supermarket in town.', avatar: '🥐' },
            { id: 3, name: 'Devan Naidoo', role: 'Budget Enthusiast', text: 'I set price drop alerts on my daily items. Whenever oil or rice goes on special, I get an email right away.', avatar: '📊' }
        ];

        const FAQS = [
            { q: 'How does Pick n Cheaper keep prices so low?', a: 'We work directly with local farmers and bulk manufacturers, eliminating middleman distributor markups and passing total savings straight to your basket.' },
            { q: 'Can I set price drop notifications for specific items?', a: 'Yes! Simply click the "Price Alert" button on any product card in our catalogue, input your target price, and our system will notify you the instant it goes on special.' },
            { q: 'Is there a minimum order requirement for store collection?', a: 'No minimums at all. Whether you are buying a single loaf of bread or stocking up your pantry for the month, you receive the same wholesale prices.' },
            { q: 'How does the Mini Savings Calculator work?', a: 'Our calculator uses real-time market basket benchmarks across competing national supermarket chains to estimate your average 18% monthly savings.' }
        ];

        // ==========================================
        // 2. REUSABLE UI COMPONENTS & ICONS
        // ==========================================

        // SVG Icon Library
        const Icons = {
            Cart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>,
            Bell: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            Shield: () => <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>,
            Truck: () => <svg className="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Sparkles: () => <svg className="w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" /></svg>,
            ChevronDown: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
        };

        // Reusable Button Component
        function Button({ children, onClick, type = 'button', variant = 'primary', isLoading = false, disabled = false, className = '' }) {
            const baseStyles = 'px-5 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98]';
            const variants = {
                primary: 'bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500 shadow-sm hover:shadow',
                accent: 'bg-amber-400 hover:bg-amber-500 text-slate-900 focus:ring-amber-400 shadow-sm hover:shadow',
                secondary: 'bg-slate-100 hover:bg-slate-200 text-slate-800 focus:ring-slate-300',
                outline: 'border-2 border-emerald-600 text-emerald-700 hover:bg-emerald-50 focus:ring-emerald-500',
                brand: 'bg-red-600 hover:bg-red-700 text-white focus:ring-red-500 shadow-sm hover:shadow',
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled || isLoading} className={`${baseStyles} ${variants[variant] || variants.primary} ${className}`}>
                    {isLoading ? (
                        <>
                            <svg className="animate-spin h-4 w-4 text-current" viewBox="0 0 24 24" fill="none">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                            </svg>
                            <span>Processing...</span>
                        </>
                    ) : children}
                </button>
            );
        }

        // Product Card Component
        function ProductCard({ product, onSelect, isSelected, onSetAlert }) {
            const { name, storeA, storeB, category, unit, badge, desc } = product;
            const savings = Math.max(0, storeB - storeA);
            const discountPercent = storeB > 0 ? Math.round((savings / storeB) * 100) : 0;

            return (
                <div 
                    onClick={() => onSelect(product.id)}
                    className={`p-5 rounded-2xl border transition-all duration-200 cursor-pointer flex flex-col justify-between relative group ${
                        isSelected 
                            ? 'border-emerald-600 bg-emerald-50/40 shadow-md ring-2 ring-emerald-500/20' 
                            : 'border-slate-200 hover:border-slate-300 bg-white shadow-sm hover:shadow'
                    }`}
                >
                    <div>
                        <div className="flex items-center justify-between gap-2 mb-2">
                            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{category}</span>
                            <div className="flex items-center gap-1.5">
                                {badge && (
                                    <span className="bg-slate-100 text-slate-700 font-semibold text-[10px] px-2 py-0.5 rounded-md">
                                        {badge}
                                    </span>
                                )}
                                {savings > 0 && (
                                    <span className="bg-emerald-100 text-emerald-800 font-bold text-xs px-2.5 py-0.5 rounded-full">
                                        Save {discountPercent}%
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="flex items-start gap-3 mt-1">
                            <div className={`w-5 h-5 rounded border flex items-center justify-center transition mt-0.5 ${isSelected ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-300 bg-white'}`}>
                                {isSelected && <Icons.Check />}
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-800 text-base leading-snug group-hover:text-red-600 transition-colors">{name}</h3>
                                <p className="text-xs text-slate-400 font-medium mt-0.5">Unit Size: {unit}</p>
                                <p className="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed">{desc}</p>
                            </div>
                        </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-sm">
                        <div>
                            <div className="text-xs text-slate-400">Pick n Cheaper</div>
                            <div className="text-lg font-extrabold text-emerald-700 leading-none mt-0.5">
                                {storeA > 0 ? `R${storeA.toFixed(2)}` : 'FREE SERVICE'}
                            </div>
                            {storeB > 0 && (
                                <div className="text-xs text-slate-400 line-through mt-0.5">
                                    Comp: R{storeB.toFixed(2)}
                                </div>
                            )}
                        </div>

                        <button 
                            type="button"
                            onClick={(e) => { e.stopPropagation(); onSetAlert(product); }}
                            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-red-100 bg-red-50 text-red-600 hover:bg-red-100 font-bold text-xs transition"
                        >
                            <Icons.Bell />
                            <span>Alert</span>
                        </button>
                    </div>
                </div>
            );
        }

        // Newsletter / Lead Capture Component
        function NewsletterCard({ title = 'Never Miss a Supermarket Deal!', subtitle = 'Get weekly price-drop alerts and exclusive grocery coupons delivered straight to your inbox.', variant = 'default' }) {
            const [email, setEmail] = useState('');
            const [status, setStatus] = useState('idle');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email) return;
                setStatus('loading');
                try {
                    await new Promise((res) => setTimeout(res, 900));
                    setStatus('success');
                    setEmail('');
                } catch {
                    setStatus('error');
                }
            };

            const isAccent = variant === 'accent';
            return (
                <div className={`p-6 sm:p-8 rounded-2xl border transition-all shadow-lg ${isAccent ? 'bg-amber-500 border-amber-400 text-slate-950' : 'bg-gradient-to-br from-red-700 to-red-900 border-red-600 text-white'}`}>
                    {status === 'success' ? (
                        <div className="text-center py-6 space-y-3">
                            <div className="text-4xl">🎉</div>
                            <h4 className="text-2xl font-extrabold">You're on the VIP Savings Pass!</h4>
                            <p className="text-sm opacity-90 max-w-md mx-auto">Check your inbox for your welcome savings pass and 10% instant discount barcode.</p>
                            <button onClick={() => setStatus('idle')} className="text-xs font-bold underline opacity-80 hover:opacity-100">Subscribe another email</button>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-black/10 text-xs font-bold uppercase tracking-wider mb-2">
                                    <Icons.Sparkles /> VIP Weekly Catalogue
                                </div>
                                <h3 className="text-2xl font-extrabold">{title}</h3>
                                <p className="text-sm opacity-90 mt-1">{subtitle}</p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-2 pt-2">
                                <input
                                    type="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="Enter your email address"
                                    className="px-4 py-3 rounded-xl text-slate-900 bg-white border-0 focus:outline-none focus:ring-2 focus:ring-red-500 flex-1 text-sm font-medium shadow-inner"
                                />
                                <Button type="submit" variant={isAccent ? 'brand' : 'accent'} isLoading={status === 'loading'} className="py-3 px-6">
                                    Get VIP Deals
                                </Button>
                            </div>
                            <div className="flex items-center gap-2 text-xs opacity-75 pt-1">
                                <Icons.Check />
                                <span>No spam ever. Unsubscribe with 1-click anytime.</span>
                            </div>
                            {status === 'error' && <p className="text-xs text-red-200">Something went wrong. Please try again.</p>}
                        </form>
                    )}
                </div>
            );
        }

        // Modal Component
        function PriceAlertModal({ product, isOpen, onClose }) {
            const [targetPrice, setTargetPrice] = useState('');
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);

            useEffect(() => {
                if (product) {
                    setTargetPrice(product.storeA);
                    setSubmitted(false);
                }
            }, [product]);

            if (!isOpen || !product) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative text-slate-800 border border-slate-100">
                        <button onClick={onClose} className="absolute top-5 right-5 w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-800 flex items-center justify-center font-bold text-sm">✕</button>
                        
                        {!submitted ? (
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-xl bg-red-100 text-red-600 flex items-center justify-center">
                                        <Icons.Bell />
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-extrabold text-slate-900">Set Price Drop Alert</h3>
                                        <p className="text-xs text-slate-500">{product.name}</p>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100 space-y-1">
                                    <div className="flex justify-between text-xs">
                                        <span className="text-slate-500">Current Price:</span>
                                        <span className="font-bold text-emerald-700">R{product.storeA.toFixed(2)}</span>
                                    </div>
                                    <div className="flex justify-between text-xs">
                                        <span className="text-slate-500">Competitor Price:</span>
                                        <span className="text-slate-400 line-through">R{product.storeB.toFixed(2)}</span>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Target Alert Price (ZAR)</label>
                                    <input 
                                        type="number" 
                                        step="0.01" 
                                        required 
                                        value={targetPrice} 
                                        onChange={(e) => setTargetPrice(e.target.value)} 
                                        className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-slate-900 focus:ring-2 focus:ring-emerald-500 outline-none font-bold text-lg" 
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1">Notification Email</label>
                                    <input 
                                        type="email" 
                                        required 
                                        value={email} 
                                        onChange={(e) => setEmail(e.target.value)} 
                                        placeholder="your.email@example.com" 
                                        className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-slate-900 focus:ring-2 focus:ring-emerald-500 outline-none text-sm" 
                                    />
                                </div>

                                <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition">
                                    Activate Instant Alert
                                </button>
                            </form>
                        ) : (
                            <div className="text-center py-6 space-y-4">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-extrabold">✓</div>
                                <h4 className="text-2xl font-extrabold text-slate-900">Price Tracker Active!</h4>
                                <p className="text-sm text-slate-600 leading-relaxed">
                                    We’ve created an active price monitoring trigger for <strong>{product.name}</strong>. You’ll receive an email at <strong>{email}</strong> the second the price hits <strong>R{targetPrice}</strong>.
                                </p>
                                <Button variant="secondary" onClick={onClose} className="w-full py-3">
                                    Back to Catalogue
                                </Button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. MAIN APPLICATION CONTAINER
        // ==========================================
        function App() {
            const [selectedItems, setSelectedItems] = useState([1, 2, 5, 9]);
            const [alertProduct, setAlertProduct] = useState(null);
            const [activeCategory, setActiveCategory] = useState('All');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [spend, setSpend] = useState(4500);
            const [openFaq, setOpenFaq] = useState(null);

            // Contact Form State
            const [contactSubmitted, setContactSubmitted] = useState(false);
            const [contactLoading, setContactLoading] = useState(false);

            const toggleItem = (id) => {
                setSelectedItems((prev) => prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]);
            };

            const toggleAllBasket = () => {
                if (selectedItems.length === SAMPLE_PRODUCTS.length) {
                    setSelectedItems([]);
                } else {
                    setSelectedItems(SAMPLE_PRODUCTS.map(p => p.id));
                }
            };

            // Calculation Totals
            const totalStoreA = SAMPLE_PRODUCTS.filter((item) => selectedItems.includes(item.id)).reduce((sum, item) => sum + item.storeA, 0);
            const totalStoreB = SAMPLE_PRODUCTS.filter((item) => selectedItems.includes(item.id)).reduce((sum, item) => sum + item.storeB, 0);
            const totalSavings = Math.max(0, totalStoreB - totalStoreA);

            const monthlyCalcSavings = Math.round(spend * 0.18);
            const annualCalcSavings = monthlyCalcSavings * 12;

            const filteredProducts = activeCategory === 'All' 
                ? SAMPLE_PRODUCTS 
                : SAMPLE_PRODUCTS.filter(p => p.category === activeCategory);

            const handleContactSubmit = async (e) => {
                e.preventDefault();
                setContactLoading(true);
                await new Promise((res) => setTimeout(res, 1000));
                setContactLoading(false);
                setContactSubmitted(true);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between selection:bg-red-500 selection:text-white">
                    <div>
                        <!-- Header Navigation Bar -->
                        <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                                    <span className="bg-red-600 text-white font-black px-3 py-1.5 rounded-xl text-xl tracking-wider shadow-sm flex items-center gap-1">
                                        P<span className="text-amber-400">n</span>C
                                    </span>
                                    <div>
                                        <h1 className="text-xl font-black text-slate-900 tracking-tight leading-none">Pick n Cheaper</h1>
                                        <span className="text-[10px] text-red-600 font-extrabold tracking-widest uppercase">Fresh Supermarket</span>
                                    </div>
                                </div>
                                
                                <nav className="hidden lg:flex items-center space-x-8 text-sm font-bold text-slate-600">
                                    <a href="#home" className="hover:text-red-600 transition-colors">Home</a>
                                    <a href="#calculator" className="hover:text-red-600 transition-colors">Savings Calculator</a>
                                    <a href="#products" className="hover:text-red-600 transition-colors">Catalogue Specials</a>
                                    <a href="#about" className="hover:text-red-600 transition-colors">About Us</a>
                                    <a href="#contact" className="hover:text-red-600 transition-colors">Contact & Leads</a>
