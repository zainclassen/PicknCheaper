<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick n Cheaper Supermarket | Compare & Save Real-Time</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 18 & Babel Standalone CDNs for runtime execution inside single-file HTML -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- React Application Mounting Target Point -->
    <div id="root"></div>

    <!-- React Application Component Script Block -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // =========================================================================
        // 1. DATA & CONSTANTS
        // =========================================================================

        const INITIAL_PRODUCTS = [
            { id: 1, name: '2L Sunflower Oil', storeA: 64.99, storeB: 79.99, category: 'Pantry', image: 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400&auto=format&fit=crop&q=80' },
            { id: 2, name: '2kg White Rice', storeA: 34.99, storeB: 42.99, category: 'Grains', image: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400&auto=format&fit=crop&q=80' },
            { id: 3, name: '2L Fresh Milk', storeA: 29.99, storeB: 33.99, category: 'Dairy', image: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400&auto=format&fit=crop&q=80' },
            { id: 4, name: 'White Bread 700g', storeA: 15.99, storeB: 18.99, category: 'Bakery', image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400&auto=format&fit=crop&q=80' },
            { id: 5, name: '1kg Cheddar Cheese', storeA: 119.99, storeB: 144.99, category: 'Dairy', image: 'https://images.unsplash.com/photo-1618160702438-9b02ab6515c9?w=400&auto=format&fit=crop&q=80' },
            { id: 6, name: 'Instant Coffee 200g', storeA: 89.99, storeB: 109.99, category: 'Pantry', image: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?w=400&auto=format&fit=crop&q=80' },
        ];

        // =========================================================================
        // 2. REUSABLE UI COMPONENTS
        // =========================================================================

        // Reusable Button Component
        function Button({ children, onClick, type = 'button', variant = 'primary', isLoading = false, disabled = false, className = '' }) {
            const baseStyles = 'px-5 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
            const variants = {
                primary: 'bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500 shadow-sm hover:shadow-emerald-600/20 hover:shadow-lg',
                accent: 'bg-amber-400 hover:bg-amber-500 text-slate-900 focus:ring-amber-400 shadow-sm hover:shadow-amber-400/20 hover:shadow-lg',
                secondary: 'bg-slate-100 hover:bg-slate-200 text-slate-800 focus:ring-slate-300',
                outline: 'border-2 border-emerald-600 text-emerald-700 hover:bg-emerald-50 focus:ring-emerald-500',
            };

            return (
                <button
                    type={type}
                    onClick={onClick}
                    disabled={disabled || isLoading}
                    className={`${baseStyles} ${variants[variant] || variants.primary} ${className}`}
                >
                    {isLoading ? (
                        <>
                            <svg className="animate-spin h-4 w-4 text-current" viewBox="0 0 24 24" fill="none">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                            </svg>
                            <span>Processing...</span>
                        </>
                    ) : (
                        children
                    )}
                </button>
            );
        }

        // Reusable Product Card Component
        function ProductCard({ product, onSelect, isSelected, onSetAlert }) {
            const { name, storeA, storeB, category, image } = product;
            const savings = Math.max(0, storeB - storeA);

            return (
                <div
                    onClick={() => onSelect(product.id)}
                    className={`p-4 rounded-xl border cursor-pointer transition-all duration-200 flex flex-col justify-between ${
                        isSelected
                            ? 'border-emerald-600 bg-emerald-50/50 shadow-md ring-2 ring-emerald-500/20 scale-[1.01]'
                            : 'border-gray-200 hover:border-gray-300 bg-white shadow-sm hover:shadow-md'
                    }`}
                >
                    <div>
                        <div className="relative h-36 w-full mb-3 rounded-lg overflow-hidden bg-gray-100">
                            <img 
                                src={image} 
                                alt={name} 
                                className="w-full h-full object-cover"
                                onError={(e) => {
                                    e.target.src = 'https://placehold.co/400x300/e2e8f0/475569?text=Grocery+Item';
                                }}
                            />
                            {savings > 0 && (
                                <span className="absolute top-2 right-2 bg-emerald-600 text-white font-bold text-xs px-2.5 py-1 rounded-full shadow-md">
                                    Save R{savings.toFixed(2)}
                                </span>
                            )}
                            <span className="absolute bottom-2 left-2 bg-slate-900/80 backdrop-blur-xs text-white text-[10px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded">
                                {category}
                            </span>
                        </div>

                        <div className="flex items-center gap-3">
                            <input
                                type="checkbox"
                                checked={isSelected}
                                onChange={() => {}} // Handled by container onClick
                                className="w-5 h-5 accent-emerald-600 rounded cursor-pointer"
                            />
                            <h3 className="font-bold text-slate-800 text-base leading-tight">{name}</h3>
                        </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between text-sm">
                        <div>
                            <span className="block text-xs text-gray-500">Pick n Cheaper (A): <strong className="text-emerald-700 text-sm font-bold">R{storeA.toFixed(2)}</strong></span>
                            <span className="block text-xs text-gray-400 line-through">Competitor (B): R{storeB.toFixed(2)}</span>
                        </div>
                        <button
                            type="button"
                            onClick={(e) => {
                                e.stopPropagation();
                                onSetAlert(product);
                            }}
                            className="px-2.5 py-1 text-xs font-bold text-emerald-700 bg-emerald-100 hover:bg-emerald-200 rounded-md transition"
                        >
                            🔔 Alert Me
                        </button>
                    </div>
                </div>
            );
        }

        // Reusable Email Newsletter / Lead Capture Component
        function NewsletterCard({
            title = 'Never Miss a Supermarket Deal!',
            subtitle = 'Get weekly price-drop alerts and exclusive grocery coupons delivered straight to your inbox.',
            variant = 'default',
        }) {
            const [email, setEmail] = useState('');
            const [status, setStatus] = useState('idle');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email) return;

                setStatus('loading');
                try {
                    // Simulate API network call
                    await new Promise((res) => setTimeout(res, 800));
                    setStatus('success');
                    setEmail('');
                } catch {
                    setStatus('error');
                }
            };

            const isAccent = variant === 'accent';

            return (
                <div
                    className={`p-6 sm:p-8 rounded-2xl border transition-all ${
                        isAccent
                            ? 'bg-amber-50 border-amber-200 text-amber-950 shadow-sm'
                            : 'bg-emerald-900 border-emerald-800 text-white shadow-xl'
                    }`}
                >
                    {status === 'success' ? (
                        <div className="text-center py-4 space-y-2">
                            <div className="text-4xl animate-bounce">🎉</div>
                            <h4 className="text-xl font-bold">You're on the list!</h4>
                            <p className="text-sm opacity-90 max-w-md mx-auto">
                                Check your inbox for your welcome savings pass and exclusive grocery discount code.
                            </p>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <h3 className="text-xl sm:text-2xl font-extrabold">{title}</h3>
                                <p className="text-sm opacity-90 mt-1 max-w-xl">{subtitle}</p>
                            </div>

                            <div className="flex flex-col sm:flex-row gap-3 pt-1">
                                <input
                                    type="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="Enter your email address"
                                    className="px-4 py-3 rounded-lg text-slate-900 bg-white border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 flex-1 text-sm shadow-inner"
                                />
                                <Button
                                    type="submit"
                                    variant={isAccent ? 'primary' : 'accent'}
                                    isLoading={status === 'loading'}
                                    className="sm:w-auto w-full py-3"
                                >
                                    Get Deals Now
                                </Button>
                            </div>

                            {status === 'error' && (
                                <p className="text-xs text-red-400 font-medium">Something went wrong. Please try again later.</p>
                            )}
                        </form>
                    )}
                </div>
            );
        }

        // Reusable Promotional Banner (Listens to Email CTA URL Query Params)
        function PromoBanner() {
            const [bannerInfo, setBannerInfo] = useState(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const campaign = params.get('utm_campaign');
                const code = params.get('promo_code');

                if (campaign === 'onboarding') {
                    setBannerInfo({
                        message: '👋 Welcome from your onboarding email! Your exclusive welcome voucher is activated.',
                        code: code || 'WELCOME10',
                    });
                } else if (campaign === 'promo_weekend_deals') {
                    setBannerInfo({
                        message: '🔥 Flash Deals Activated! Showing this weekend’s absolute lowest price-drop specials.',
                        code: code || 'WEEKEND20',
                    });
                }
            }, []);

            if (!bannerInfo) return null;

            return (
                <div className="bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-700 text-white p-4 text-center rounded-xl shadow-lg mb-6 flex flex-col sm:flex-row items-center justify-between gap-3 border border-emerald-400/30 animate-fade-in">
                    <p className="font-semibold text-sm sm:text-base flex items-center gap-2">
                        {bannerInfo.message}
                    </p>
                    {bannerInfo.code && (
                        <span className="bg-amber-300 text-slate-900 font-black px-3 py-1 rounded-lg text-xs tracking-wider shadow">
                            CODE: {bannerInfo.code}
                        </span>
                    )}
                </div>
            );
        }

        // Modal for Price Alert Set
        function PriceAlertModal({ product, isOpen, onClose }) {
            const [targetPrice, setTargetPrice] = useState(product?.storeA || '');
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (product) {
                    setTargetPrice(product.storeA);
                    setSubmitted(false);
                }
            }, [product]);

            if (!isOpen || !product) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setSubmitted(true);
                }, 600);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative border border-slate-100">
                        <button 
                            onClick={onClose} 
                            className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 p-1 font-bold text-lg"
                        >
                            ✕
                        </button>
                        {!submitted ? (
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="space-y-1">
                                    <span className="text-xs font-bold text-emerald-600 uppercase tracking-wider">Price Watcher</span>
                                    <h3 className="text-2xl font-extrabold text-slate-900">Set Price Alert</h3>
                                    <p className="text-sm text-slate-500">
                                        We'll monitor <strong>{product.name}</strong> and instantly alert you when the price drops below your target.
                                    </p>
                                </div>

                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Target Price (ZAR)</label>
                                        <div className="relative">
                                            <span className="absolute left-3 top-2.5 text-slate-400 font-bold">R</span>
                                            <input
                                                type="number"
                                                step="0.01"
                                                required
                                                value={targetPrice}
                                                onChange={(e) => setTargetPrice(e.target.value)}
                                                className="w-full pl-8 pr-4 py-2.5 border border-slate-300 rounded-lg text-slate-900 font-bold focus:ring-2 focus:ring-emerald-500 outline-none"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Your Notification Email</label>
                                        <input
                                            type="email"
                                            required
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            placeholder="you@example.com"
                                            className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-slate-900 focus:ring-2 focus:ring-emerald-500 outline-none text-sm"
                                        />
                                    </div>
                                </div>

                                <Button type="submit" variant="primary" isLoading={loading} className="w-full py-3">
                                    Activate Price Watcher
                                </Button>
                            </form>
                        ) : (
                            <div className="text-center py-6 space-y-4">
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-black">
                                    ✓
                                </div>
                                <div>
                                    <h4 className="text-xl font-extrabold text-slate-900">Price Alert Set!</h4>
                                    <p className="text-sm text-slate-600 mt-1">
                                        We will send an instant alert to <strong>{email}</strong> when {product.name} reaches <strong>R{Number(targetPrice).toFixed(2)}</strong>.
                                    </p>
                                </div>
                                <Button onClick={onClose} variant="secondary" className="w-full">
                                    Done & Return to Shopping
                                </Button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // =========================================================================
        // 3. MAIN PAGE SECTIONS & NAV
        // =========================================================================

        function HeaderNav() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            return (
                <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16 sm:h-20">
                        {/* Logo */}
                        <a href="#home" className="flex items-center gap-2 group">
                            <span className="bg-emerald-600 text-white p-2 rounded-xl text-xl font-black shadow-md group-hover:bg-emerald-700 transition">🛒</span>
                            <div className="flex flex-col">
                                <span className="text-xl sm:text-2xl font-black text-emerald-700 tracking-tight leading-none">Pick n Cheaper</span>
                                <span className="text-[10px] font-bold text-slate-400 tracking-widest uppercase">Smart Grocery Savings</span>
                            </div>
                        </a>

                        {/* Desktop Links */}
                        <nav className="hidden md:flex items-center gap-8 font-semibold text-sm text-slate-600">
                            <a href="#home" className="hover:text-emerald-600 transition">Home</a>
                            <a href="#products" className="hover:text-emerald-600 transition">Products & Services</a>
                            <a href="#calculator" className="hover:text-emerald-600 transition">Basket Calculator</a>
                            <a href="#about" className="hover:text-emerald-600 transition">About Us</a>
                            <a href="#contact" className="hover:text-emerald-600 transition">Contact & Leads</a>
                            <a href="#campaign" className="hover:text-emerald-600 transition">Campaign Hub</a>
                        </nav>

                        {/* CTA Header Button */}
                        <div className="hidden sm:block">
                            <a href="#calculator" className="px-4 py-2 bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-bold text-xs rounded-lg transition">
                                Launch Calculator 🛒
                            </a>
                        </div>

                        {/* Mobile Toggle */}
                        <button 
                            onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                            className="md:hidden p-2 text-slate-600 hover:text-slate-900 font-bold"
                        >
                            {mobileMenuOpen ? '✕' : '☰'}
                        </button>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {mobileMenuOpen && (
                        <div className="md:hidden bg-white border-b border-slate-200 px-4 py-4 space-y-3 font-semibold text-sm">
                            <a href="#home" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-slate-700 hover:text-emerald-600">Home</a>
                            <a href="#products" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-slate-700 hover:text-emerald-600">Products & Services</a>
                            <a href="#calculator" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-slate-700 hover:text-emerald-600">Basket Calculator</a>
                            <a href="#about" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-slate-700 hover:text-emerald-600">About Us</a>
                            <a href="#contact" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-slate-700 hover:text-emerald-600">Contact & Leads</a>
                            <a href="#campaign" onClick={() => setMobileMenuOpen(false)} className="block py-2 text-slate-700 hover:text-emerald-600">Campaign Hub</a>
                        </div>
                    )}
                </header>
            );
        }

        function HeroSection() {
            return (
                <section id="home" className="relative bg-gradient-to-br from-emerald-900 via-emerald-800 to-slate-900 text-white py-16 sm:py-24 px-4 overflow-hidden">
                    <div className="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                        <div className="space-y-6 text-center lg:text-left">
                            <span className="inline-block bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full">
                                Real-Time Price Comparison
                            </span>
                            <h1 className="text-4xl sm:text-5xl lg:text-6xl font-black tracking-tight leading-tight">
                                Never Pay Full Price For Groceries Again.
                            </h1>
                            <p className="text-emerald-100 text-base sm:text-lg max-w-xl mx-auto lg:mx-0">
                                Pick n Cheaper tracks daily price changes across major supermarkets so you can build your basket, compare totals side-by-side, and save every single week.
                            </p>
                            <div className="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4 pt-2">
                                <a href="#calculator" className="w-full sm:w-auto px-6 py-3.5 bg-amber-400 hover:bg-amber-500 text-slate-950 font-extrabold rounded-xl shadow-lg transition text-center">
                                    Start Saving Now 🛒
                                </a>
                                <a href="#products" className="w-full sm:w-auto px-6 py-3.5 bg-white/10 hover:bg-white/20 text-white border border-white/20 font-bold rounded-xl transition text-center">
                                    Browse Weekly Specials
                                </a>
                            </div>
                        </div>

                        <div className="bg-white/10 backdrop-blur-md border border-white/10 p-6 sm:p-8 rounded-2xl shadow-2xl space-y-4">
                            <h3 className="text-lg font-bold text-amber-300 uppercase tracking-wider text-center">Why Pick n Cheaper?</h3>
                            <div className="grid grid-cols-2 gap-4 text-center">
                                <div className="bg-white/5 p-4 rounded-xl border border-white/5">
                                    <div className="text-3xl font-black text-white">25%+</div>
                                    <div className="text-xs text-emerald-200 mt-1">Average Weekly Basket Savings</div>
                                </div>
                                <div className="bg-white/5 p-4 rounded-xl border border-white/5">
                                    <div className="text-3xl font-black text-white">Daily</div>
                                    <div className="text-xs text-emerald-200 mt-1">Automated Supermarket Price Sync</div>
                                </div>
                                <div className="bg-white/5 p-4 rounded-xl border border-white/5">
                                    <div className="text-3xl font-black text-white">100%</div>
                                    <div className="text-xs text-emerald-200 mt-1">Free Price Alerts & Coupons</div>
                                </div>
                                <div className="bg-white/5 p-4 rounded-xl border border-white/5">
                                    <div className="text-3xl font-black text-white">POPIA</div>
                                    <div className="text-xs text-emerald-200 mt-1">Compliant Data Protection</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function ServicesSection() {
            return (
                <section id="products" className="py-16 bg-slate-100 border-b border-slate-200">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6">
                        <div className="text-center max-w-2xl mx-auto mb-12 space-y-2">
                            <span className="text-xs font-bold text-emerald-600 uppercase tracking-widest">Our Offerings</span>
                            <h2 className="text-3xl font-extrabold text-slate-900">Products & Smart Grocery Services</h2>
                            <p className="text-slate-600 text-sm">Everything you need to optimize your household budget and shop smarter.</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <div className="text-3xl">📊</div>
                                <h3 className="text-xl font-bold text-slate-900">Live Price Index</h3>
                                <p className="text-slate-600 text-sm">Real-time daily tracking across pantry staples, fresh dairy, meats, and household goods from leading competitors.</p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <div className="text-3xl">🛒</div>
                                <h3 className="text-xl font-bold text-slate-900">Smart Basket Comparison</h3>
                                <p className="text-slate-600 text-sm">Add items to a single shopping list and see immediately which store gives you the lowest basket total.</p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <div className="text-3xl">🔔</div>
                                <h3 className="text-xl font-bold text-slate-900">Automated Price Drop Alerts</h3>
                                <p className="text-slate-600 text-sm">Set custom target prices for high-value items and receive instant email notifications when items drop on promotion.</p>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function AboutUsSection() {
            return (
                <section id="about" className="py-16 bg-white border-b border-slate-200">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                            <div className="space-y-4">
                                <span className="text-xs font-bold text-emerald-600 uppercase tracking-widest">About Pick n Cheaper</span>
                                <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900">Empowering Smart Shoppers Everywhere</h2>
                                <p className="text-slate-600 leading-relaxed text-sm sm:text-base">
                                    Pick n Cheaper was founded to bring complete price transparency to supermarket shopping. We believe families shouldn't have to spend hours checking paper flyers to know if they are getting the best deal on daily essentials.
                                </p>
                                <p className="text-slate-600 leading-relaxed text-sm sm:text-base">
                                    By leveraging daily automated price monitoring and user-friendly basket calculations, we help households cut their grocery bills by up to 25% every month.
                                </p>
                            </div>
                            <div className="bg-emerald-50 border border-emerald-100 p-8 rounded-2xl space-y-4">
                                <h4 className="font-bold text-emerald-950 text-lg">Our Core Commitments</h4>
                                <ul className="space-y-3 text-sm text-emerald-900">
                                    <li className="flex items-start gap-2">
                                        <span className="font-bold text-emerald-600">✓</span>
                                        <strong>100% Independent:</strong> Fair and unbiased store price comparisons.
                                    </li>
                                    <li className="flex items-start gap-2">
                                        <span className="font-bold text-emerald-600">✓</span>
                                        <strong>POPIA Compliant:</strong> We safeguard your privacy and lead data with strict confidentiality.
                                    </li>
                                    <li className="flex items-start gap-2">
                                        <span className="font-bold text-emerald-600">✓</span>
                                        <strong>No Hidden Fees:</strong> Free basket calculator tools for every consumer.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function ContactFormSection() {
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);

            const handleContactSubmit = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setSubmitted(true);
                }, 700);
            };

            return (
                <section id="contact" className="py-16 bg-slate-50 border-b border-slate-200">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6">
                        <div className="text-center max-w-xl mx-auto mb-10 space-y-2">
                            <span className="text-xs font-bold text-emerald-600 uppercase tracking-widest">Get In Touch</span>
                            <h2 className="text-3xl font-extrabold text-slate-900">Contact Us & Lead Inquiries</h2>
                            <p className="text-slate-600 text-sm">Have questions about retail partnerships or pricing alerts? Send us a message.</p>
                        </div>

                        <div className="bg-white p-6 sm:p-10 rounded-2xl shadow-sm border border-slate-200">
                            {submitted ? (
                                <div className="text-center py-8 space-y-3">
                                    <div className="text-4xl">✉️</div>
                                    <h3 className="text-2xl font-extrabold text-slate-900">Thank You!</h3>
                                    <p className="text-slate-600 text-sm">Your message has been received. Our team will respond within 24 hours.</p>
                                    <Button onClick={() => setSubmitted(false)} variant="secondary" className="mt-4">
                                        Send Another Message
                                    </Button>
                                </div>
                            ) : (
                                <form onSubmit={handleContactSubmit} className="space-y-6">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Full Name</label>
                                            <input type="text" required placeholder="John Doe" className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address</label>
                                            <input type="email" required placeholder="john@example.com" className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Subject</label>
                                        <input type="text" required placeholder="Grocery Partner Lead / Price Question" className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Message</label>
                                        <textarea rows="4" required placeholder="Tell us how we can help..." className="w-full px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                                    </div>

                                    <div className="flex items-start gap-2">
                                        <input type="checkbox" required id="popia" className="mt-1 accent-emerald-600 rounded" />
                                        <label htmlFor="popia" className="text-xs text-slate-500">
                                            I consent to Pick n Cheaper storing my contact information in accordance with POPIA regulations for lead response purposes.
                                        </label>
                                    </div>

                                    <Button type="submit" variant="primary" isLoading={loading} className="w-full py-3">
                                        Submit Inquiry
                                    </Button>
                                </form>
                            )}
                        </div>
                    </div>
                </section>
            );
        }

        function CampaignHubSection() {
            return (
                <section id="campaign" className="py-16 bg-white border-b border-slate-200">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6">
                        <div className="text-center max-w-xl mx-auto mb-8 space-y-2">
                            <span className="text-xs font-bold text-emerald-600 uppercase tracking-widest">Demo Testing Hub</span>
                            <h2 className="text-3xl font-extrabold text-slate-900">Email Campaign Link Simulator</h2>
                            <p className="text-slate-600 text-sm">Click the test links below to simulate dynamic URL parameters (UTM campaign tags & promo codes) and observe top hero banner updates.</p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <a 
                                href="?utm_campaign=onboarding&promo_code=WELCOME10#home" 
                                className="p-4 rounded-xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 transition flex items-center justify-between"
                            >
                                <div>
                                    <div className="font-bold text-emerald-950 text-sm">Onboarding Campaign Link</div>
                                    <div className="text-xs text-emerald-700">utm_campaign=onboarding & promo_code=WELCOME10</div>
                                </div>
                                <span className="text-lg">➡️</span>
                            </a>

                            <a 
                                href="?utm_campaign=promo_weekend_deals&promo_code=WEEKEND20#home" 
                                className="p-4 rounded-xl border border-amber-200 bg-amber-50 hover:bg-amber-100 transition flex items-center justify-between"
                            >
                                <div>
                                    <div className="font-bold text-amber-950 text-sm">Flash Weekend Promo Link</div>
                                    <div className="text-xs text-amber-700">utm_campaign=promo_weekend_deals</div>
                                </div>
                                <span className="text-lg">➡️</span>
                            </a>
                        </div>
                    </div>
                </section>
            );
        }

        // =========================================================================
        // 4. MAIN INTEGRATED APPLICATION CONTAINER
        // =========================================================================

        function App() {
            const [selectedItems, setSelectedItems] = useState([1, 2]);
            const [alertProduct, setAlertProduct] = useState(null);

            const toggleItem = (id) => {
                setSelectedItems((prev) =>
                    prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]
                );
            };

            // Calculate Store Totals & Savings dynamically
            const totalStoreA = INITIAL_PRODUCTS
                .filter((item) => selectedItems.includes(item.id))
                .reduce((sum, item) => sum + item.storeA, 0);

            const totalStoreB = INITIAL_PRODUCTS
                .filter((item) => selectedItems.includes(item.id))
                .reduce((sum, item) => sum + item.storeB, 0);

            const totalSavings = Math.max(0, totalStoreB - totalStoreA);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Static Navigation Header */}
                        <HeaderNav />

                        {/* Hero Section */}
                        <HeroSection />

                        {/* Interactive Main Savings Section */}
                        <div id="calculator" className="py-12 px-4 max-w-4xl mx-auto space-y-6">
                            {/* Dynamic Email Link CTA Landing Banner */}
                            <PromoBanner />

                            {/* Core Extended Feature: Interactive Basket Calculator */}
                            <main className="bg-white rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-100 space-y-6">
                                <div className="border-b border-slate-100 pb-4">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">
                                            🛒 Smart Basket Savings Calculator
                                        </h2>
                                        <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">
                                            {selectedItems.length} items selected
                                        </span>
                                    </div>
                                    <p className="text-sm text-slate-500 mt-1">
                                        Select items to calculate your real-time total basket savings between Store A (Pick n Cheaper) and Store B (Competitor).
                                    </p>
                                </div>

                                {/* Product Items Grid */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {INITIAL_PRODUCTS.map((product) => (
                                        <ProductCard
                                            key={product.id}
                                            product={product}
                                            isSelected={selectedItems.includes(product.id)}
                                            onSelect={toggleItem}
                                            onSetAlert={(prod) => setAlertProduct(prod)}
                                        />
                                    ))}
                                </div>

                                {/* Real-time Calculation Summary */}
                                <div className="bg-slate-900 text-white rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-xl">
                                    <div>
                                        <p className="text-xs uppercase tracking-widest text-slate-400 font-bold">
                                            Total Calculated Basket Savings
                                        </p>
                                        <p className="text-4xl font-black text-amber-400 mt-1">
                                            R{totalSavings.toFixed(2)}
                                        </p>
                                    </div>
                                    <div className="text-right text-xs text-slate-300 space-y-1 sm:border-l sm:border-slate-800 sm:pl-6 w-full sm:w-auto">
                                        <p className="flex justify-between sm:justify-end gap-4">
                                            <span>Pick n Cheaper (Store A):</span>
                                            <strong className="text-emerald-400 font-bold">R{totalStoreA.toFixed(2)}</strong>
                                        </p>
                                        <p className="flex justify-between sm:justify-end gap-4">
                                            <span>Competitor Total (Store B):</span>
                                            <strong className="text-slate-400 line-through">R{totalStoreB.toFixed(2)}</strong>
                                        </p>
                                    </div>
                                </div>

                                {/* Integrated Email Lead Capture */}
                                <NewsletterCard
                                    title="Save This Basket & Get Price Drop Alerts"
                                    subtitle="We will monitor these items daily and email you when prices drop even lower."
                                    variant="accent"
                                />
                            </main>
                        </div>

                        {/* Products & Services Section */}
                        <ServicesSection />

                        {/* About Us Section */}
                        <AboutUsSection />

                        {/* Contact Form & POPIA Compliance */}
                        <ContactFormSection />

                        {/* Campaign URL Link Tester */}
                        <CampaignHubSection />

                        {/* Global Footer Newsletter Lead Capture */}
                        <div className="max-w-4xl mx-auto px-4 py-8">
                            <NewsletterCard />
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="bg-slate-950 text-slate-400 text-xs py-8 px-4 text-center border-t border-slate-900">
                        <div className="max-w-6xl mx-auto space-y-3">
                            <p>© {new Date().getFullYear()} Pick n Cheaper Supermarket. All rights reserved.</p>
                            <p className="text-slate-500">
                                Single-Page Application deployed on GitHub Pages. POPIA compliant price monitoring system.
                            </p>
                        </div>
                    </footer>

                    {/* Price Alert Modal Popup */}
                    <PriceAlertModal
                        product={alertProduct}
                        isOpen={Boolean(alertProduct)}
                        onClose={() => setAlertProduct(null)}
                    />
                </div>
            );
        }

        // Render React Root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
