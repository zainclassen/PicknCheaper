<!DOCTYPE html>

    <title>Pick n Cheaper Supermarket | Fresh, Affordable Groceries & Price Comparison</title>
    <!-- Tailwind CSS CDN -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#dc2626',
                            700: '#b91c1c',

</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-800 custom-scrollbar">

    <!-- React Application Container -->
    <div id="root"></div>

    <!-- React Application Logic -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 1. SVG ICON COMPONENTS
        // ==========================================
        const IconCart = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />

        );

        const IconCheck = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
            </svg>
        );

        const IconBell = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">

            </svg>
        );

        const IconTag = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
        );

        const IconShield = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        );

        const IconTruck = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0zM13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 100-4 2 2 0 000 4zm10 0a2 2 0 100-4 2 2 0 000 4z" />
            </svg>
        );

        const IconSprout = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
        );

        const IconMail = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        );

        const IconClose = ({ className = "w-5 h-5" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        const IconMenu = ({ className = "w-6 h-6" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        );

        // ==========================================
        // 2. PRODUCT MASTER CATALOG (EXPANDED DATA)
        // ==========================================
        const MASTER_PRODUCTS = [
            { id: 1, name: 'Pure Sunflower Cooking Oil 2L', storeA: 64.99, storeB: 79.99, category: 'Cheaper Staples', unit: '2L Bottle', inStock: true, badge: 'Top Saver' },
            { id: 2, name: 'Long Grain Parboiled White Rice 2kg', storeA: 34.99, storeB: 42.99, category: 'Cheaper Staples', unit: '2kg Bag', inStock: true, badge: 'Best Seller' },
            { id: 3, name: 'Full Cream Fresh Farm Milk 2L', storeA: 29.99, storeB: 33.99, category: 'Fresh Harvest', unit: '2L Jug', inStock: true, badge: 'Fresh Daily' },
            { id: 4, name: 'Enriched Soft White Bread 700g', storeA: 15.99, storeB: 18.99, category: 'Daily Bakery', unit: '700g Loaf', inStock: true, badge: 'Baked Today' },
            { id: 5, name: 'Fresh Grade A Extra Large Eggs 30s', storeA: 74.99, storeB: 89.99, category: 'Fresh Harvest', unit: 'Tray of 30', inStock: true, badge: 'Farm Fresh' },
            { id: 6, name: 'Super White Refined Sugar 2.5kg', storeA: 44.99, storeB: 52.99, category: 'Pantry & Grains', unit: '2.5kg Bag', inStock: true, badge: 'Essential' },
            { id: 7, name: 'Cake Wheat Flour 2.5kg', storeA: 36.99, storeB: 44.99, category: 'Pantry & Grains', unit: '2.5kg Bag', inStock: true, badge: 'Pantry Staple' },
            { id: 8, name: 'Fresh Chicken Breast Fillets 1kg', storeA: 79.99, storeB: 94.99, category: 'Fresh Harvest', unit: '1kg Pack', inStock: true, badge: 'Lean Protein' },
            { id: 9, name: 'Golden Honey Crunch Cereal 500g', storeA: 39.99, storeB: 49.99, category: 'Pantry & Grains', unit: '500g Box', inStock: true, badge: 'Breakfast Deal' },
            { id: 10, name: 'Whole Brown Bread 700g', storeA: 14.99, storeB: 17.99, category: 'Daily Bakery', unit: '700g Loaf', inStock: true, badge: 'High Fibre' },
            { id: 11, name: 'Mature Cheddar Cheese Block 800g', storeA: 109.99, storeB: 129.99, category: 'Fresh Harvest', unit: '800g Block', inStock: true, badge: 'Dairy Special' },
            { id: 12, name: 'Instant Gold Roasted Coffee 200g', storeA: 89.99, storeB: 109.99, category: 'Pantry & Grains', unit: '200g Jar', inStock: true, badge: 'Value Pack' }
        ];

        // ==========================================
        // 3. REUSABLE UI COMPONENTS
        // ==========================================
        function Button({ children, onClick, type = 'button', variant = 'primary', isLoading = false, disabled = false, className = '' }) {
            const baseStyles = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer';
            
            const variants = {
                primary: 'bg-savings-600 hover:bg-savings-700 text-white focus:ring-savings-500 shadow-sm hover:shadow',
                accent: 'bg-amber-400 hover:bg-amber-500 text-slate-900 focus:ring-amber-400 shadow-sm hover:shadow',
                secondary: 'bg-slate-100 hover:bg-slate-200 text-slate-800 focus:ring-slate-300',
                outline: 'border-2 border-savings-600 text-savings-700 hover:bg-savings-50 focus:ring-savings-500',
                brand: 'bg-brand-600 hover:bg-brand-700 text-white focus:ring-brand-500 shadow-md hover:shadow-lg',
                dark: 'bg-slate-900 hover:bg-slate-800 text-white focus:ring-slate-700 shadow-sm'
            };

            return (
                <button type={type} onClick={onClick} disabled={disabled || isLoading} className={`${baseStyles} ${variants[variant] || variants.primary} ${className}`}>
                    {isLoading ? (
                        <>
                            <svg className="animate-spin h-4 w-4 text-current" viewBox="0 0 24 24" fill="none">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                            </svg>
                            <span>Processing...</span>
                        </>
                    ) : children}
                </button>
            );
        }

        function ProductCard({ product, onSelect, isSelected, onSetAlert }) {
            const { name, storeA, storeB, category, unit, badge } = product;
            const savings = Math.max(0, storeB - storeA);
            const savingsPercentage = Math.round((savings / storeB) * 100);

            return (
                <div 
                    onClick={() => onSelect(product.id)}
                    className={`p-5 rounded-2xl border transition-all duration-200 cursor-pointer flex flex-col justify-between relative group ${
                        isSelected 
                            ? 'border-savings-500 bg-savings-50/40 shadow-md ring-2 ring-savings-500/20' 
                            : 'border-slate-200 hover:border-slate-300 bg-white shadow-sm hover:shadow'
                    }`}
                >
                    <div>
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">{category}</span>
                            {badge && (
                                <span className="bg-brand-100 text-brand-700 text-[10px] font-extrabold px-2 py-0.5 rounded-md">
                                    {badge}
                                </span>
                            )}
                        </div>

                        <div className="flex items-start gap-3">
                            <div className="pt-1">
                                <input 
                                    type="checkbox" 
                                    checked={isSelected} 
                                    onChange={() => {}} 
                                    className="w-5 h-5 accent-savings-600 rounded-md cursor-pointer"
                                />
                            </div>
                            <div>
                                <h3 className="font-bold text-slate-900 text-base leading-snug group-hover:text-brand-600 transition-colors">
                                    {name}
                                </h3>
                                <p className="text-xs text-slate-400 mt-0.5">{unit}</p>
                            </div>
                        </div>
                    </div>

                    <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                        <div>
                            <div className="flex items-baseline gap-2">
                                <span className="text-xs text-slate-500">PnC Price:</span>
                                <span className="text-lg font-black text-savings-700">R{storeA.toFixed(2)}</span>
                            </div>
                            <div className="flex items-center gap-2 text-xs">
                                <span className="text-slate-400 line-through">Regular: R{storeB.toFixed(2)}</span>
                                <span className="text-savings-600 font-bold bg-savings-100 px-1.5 py-0.5 rounded text-[10px]">
                                    Save {savingsPercentage}%
                                </span>
                            </div>
                        </div>

                        <button 
                            type="button"
                            onClick={(e) => { e.stopPropagation(); onSetAlert(product); }}
                            className="p-2 text-slate-400 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition"
                            title="Set Price Drop Alert"
                        >
                            <IconBell className="w-5 h-5" />
                        </button>
                    </div>
                </div>
            );
        }

        function NewsletterCard({ title = 'Never Miss a Supermarket Deal!', subtitle = 'Get weekly price-drop alerts and exclusive grocery coupons delivered straight to your inbox.', variant = 'default' }) {
            const [email, setEmail] = useState('');
            const [status, setStatus] = useState('idle');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email) return;
                setStatus('loading');
                try {
                    await new Promise((res) => setTimeout(res, 800));
                    setStatus('success');
                    setEmail('');
                } catch {
                    setStatus('error');
                }
            };

            const isAccent = variant === 'accent';
            const isVip = variant === 'vip';

            if (isVip) {
                return (
                    <div className="p-8 rounded-3xl bg-gradient-to-r from-amber-400 via-amber-300 to-yellow-400 border border-amber-300 shadow-xl text-slate-900 relative overflow-hidden">
                        <div className="absolute -right-8 -bottom-8 opacity-10 pointer-events-none">
                            <IconTag className="w-64 h-64 text-slate-900" />
                        </div>
                        {status === 'success' ? (
                            <div className="text-center py-6 space-y-2">
                                <div className="text-4xl">🎉</div>
                                <h4 className="text-2xl font-black">VIP Savings Unlocked!</h4>
                                <p className="text-sm text-slate-800 max-w-md mx-auto">Check your email for your exclusive R100 shopping voucher and digital discount card.</p>
                            </div>
                        ) : (
                            <form onSubmit={handleSubmit} className="space-y-4 relative z-10 max-w-2xl mx-auto text-center">
                                <span className="bg-slate-900 text-amber-300 text-xs font-black uppercase tracking-wider px-3 py-1 rounded-full inline-block">VIP Member Club</span>
                                <h3 className="text-2xl sm:text-3xl font-black">{title}</h3>
                                <p className="text-sm font-medium text-slate-800">{subtitle}</p>
                                <div className="flex flex-col sm:flex-row gap-3 pt-2">
                                    <input
                                        type="email"
                                        required
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        placeholder="Enter your email for instant voucher"
                                        className="px-5 py-3 rounded-xl text-slate-900 bg-white border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-900 flex-1 text-sm font-medium shadow-inner"
                                    />
                                    <Button type="submit" variant="dark" isLoading={status === 'loading'} className="py-3 px-8">
                                        Claim R100 Voucher
                                    </Button>
                                </div>
                                <p className="text-[11px] text-slate-700">By joining you agree to receive weekly digital catalogue flyers. Unsubscribe anytime.</p>
                            </form>
                        )}
                    </div>
                );
            }

            return (
                <div className={`p-6 sm:p-8 rounded-2xl border transition-all ${
                    isAccent 
                        ? 'bg-amber-50 border-amber-200 text-amber-900' 
                        : 'bg-brand-700 border-brand-800 text-white shadow-lg'
                }`}>
                    {status === 'success' ? (
                        <div className="text-center py-4 space-y-2">
                            <div className="text-3xl">🎉</div>
                            <h4 className="text-xl font-bold">You're on the savings list!</h4>
                            <p className="text-sm opacity-90">Check your inbox for your welcome savings pass and discount code.</p>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <h3 className="text-xl font-extrabold">{title}</h3>
                                <p className="text-sm opacity-90 mt-1 leading-relaxed">{subtitle}</p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-2">
                                <input
                                    type="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="Enter your email address"
                                    className="px-4 py-3 rounded-xl text-slate-900 bg-white border border-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-500 flex-1 text-sm"
                                />
                                <Button type="submit" variant={isAccent ? 'primary' : 'accent'} isLoading={status === 'loading'}>
                                    Get Weekly Deals
                                </Button>
                            </div>
                            {status === 'error' && <p className="text-xs text-red-300">Something went wrong. Please try again.</p>}
                        </form>
                    )}
                </div>
            );
        }

        // ==========================================
        // 4. PRICE ALERT MODAL OVERLAY
        // ==========================================
        function PriceAlertModal({ product, isOpen, onClose }) {
            const [targetPrice, setTargetPrice] = useState('');
            const [email, setEmail] = useState('');
            const [popiaConsent, setPopiaConsent] = useState(true);
            const [submitted, setSubmitted] = useState(false);

            useEffect(() => {
                if (product) {
                    setTargetPrice(product.storeA);
                    setSubmitted(false);
                }
            }, [product]);

            if (!isOpen || !product) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fadeIn">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl relative text-slate-800 border border-slate-100">
                        <button 
                            onClick={onClose} 
                            className="absolute top-5 right-5 text-slate-400 hover:text-slate-600 font-bold p-1 rounded-full hover:bg-slate-100 transition"
                        >
                            <IconClose />
                        </button>
                        
                        {!submitted ? (
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div className="flex items-center gap-3">
                                    <div className="p-3 bg-brand-50 text-brand-600 rounded-2xl">
                                        <IconBell className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-extrabold text-slate-900">Set Price Alert</h3>
                                        <p className="text-xs text-slate-500">Pick n Cheaper Smart Price Monitor</p>
                                    </div>
                                </div>

                                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100">
                                    <p className="text-xs text-slate-500">Selected Product:</p>
                                    <p className="font-bold text-slate-800 text-sm">{product.name}</p>
                                    <p className="text-xs text-savings-600 font-semibold mt-0.5">Current Price: R{product.storeA.toFixed(2)}</p>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Alert Target Price (ZAR)</label>
                                    <div className="relative">
                                        <span className="absolute left-3.5 top-2.5 text-slate-400 font-bold text-sm">R</span>
                                        <input 
                                            type="number" 
                                            step="0.01" 
                                            required 
                                            value={targetPrice} 
                                            onChange={(e) => setTargetPrice(e.target.value)} 
                                            className="w-full pl-8 pr-4 py-2.5 border border-slate-300 rounded-xl text-slate-900 font-bold focus:ring-2 focus:ring-savings-500 focus:border-savings-500 outline-none" 
                                        />
                                    </div>
                                    <p className="text-[11px] text-slate-400 mt-1">We'll alert you if the price drops below this value.</p>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Your Email Address</label>
                                    <input 
                                        type="email" 
                                        required 
                                        value={email} 
                                        onChange={(e) => setEmail(e.target.value)} 
                                        placeholder="name@example.co.za" 
                                        className="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-slate-900 text-sm focus:ring-2 focus:ring-savings-500 focus:border-savings-500 outline-none" 
                                    />
                                </div>

                                <div className="flex items-start gap-2 pt-1">
                                    <input 
                                        type="checkbox" 
                                        id="popia" 
                                        checked={popiaConsent} 
                                        onChange={(e) => setPopiaConsent(e.target.checked)} 
                                        required 
                                        className="mt-0.5 w-4 h-4 accent-savings-600 rounded"
                                    />
                                    <label htmlFor="popia" className="text-[11px] text-slate-500 leading-tight">
                                        I consent to Pick n Cheaper processing my email address for price alert notifications in compliance with the Protection of Personal Information Act (POPIA).
                                    </label>
                                </div>

                                <Button type="submit" variant="primary" className="w-full py-3">
                                    Activate Price Drop Alert
                                </Button>
                            </form>
                        ) : (
                            <div className="text-center py-6 space-y-4">
                                <div className="w-16 h-16 bg-savings-100 text-savings-600 rounded-full flex items-center justify-center mx-auto shadow-inner">
                                    <IconCheck className="w-8 h-8" />
                                </div>
                                <div>
                                    <h4 className="text-xl font-extrabold text-slate-900">Price Alert Activated!</h4>
                                    <p className="text-sm text-slate-600 mt-1">
                                        We will send an instant notification to <strong className="text-slate-900">{email}</strong> as soon as <strong>{product.name}</strong> hits R{targetPrice}.
                                    </p>
                                </div>
                                <Button onClick={onClose} variant="secondary" className="w-full">
                                    Back to Shopping
                                </Button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 5. MAIN APPLICATION COMPONENT
        // ==========================================
        function App() {
            const [selectedItems, setSelectedItems] = useState([1, 2, 3, 4]);
            const [alertProduct, setAlertProduct] = useState(null);
            const [activeCategory, setActiveCategory] = useState('All');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [spend, setSpend] = useState(4500);
            const [household, setHousehold] = useState('Family Household (3-4 People)');

            // Contact Form State
            const [contactForm, setContactForm] = useState({ name: '', email: '', queryType: 'General Inquiry', subject: '', message: '', popia: false });
            const [contactSubmitted, setContactSubmitted] = useState(false);

            const toggleItem = (id) => {
                setSelectedItems((prev) => 
                    prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]
                );
            };

            const selectAllProducts = () => {
                setSelectedItems(MASTER_PRODUCTS.map(p => p.id));
            };

            const clearAllProducts = () => {
                setSelectedItems([]);
            };

            // Calculated Totals
            const totalStoreA = useMemo(() => {
                return MASTER_PRODUCTS
                    .filter((item) => selectedItems.includes(item.id))
                    .reduce((sum, item) => sum + item.storeA, 0);
