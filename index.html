<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick n Cheaper Supermarket | Fresh, Affordable Groceries</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased selection:bg-red-100 selection:text-red-700">

    <!-- React Root Mount -->
    <div id="root"></div>

    <!-- React Application Script -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        const SAMPLE_PRODUCTS = [
            { id: 1, name: '2L Sunflower Oil', storeA: 64.99, storeB: 79.99, category: 'Cheaper Staples' },
            { id: 2, name: '2kg White Rice', storeA: 34.99, storeB: 42.99, category: 'Cheaper Staples' },
            { id: 3, name: '2L Fresh Milk', storeA: 29.99, storeB: 33.99, category: 'Fresh Harvest' },
            { id: 4, name: 'White Bread 700g', storeA: 15.99, storeB: 18.99, category: 'Fresh Harvest' },
        ];

        // Reusable Button Component
        function Button({ children, onClick, type = 'button', variant = 'primary', isLoading = false, disabled = false, className = '' }) {
            const baseStyles = 'px-5 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed';
            const variants = {
                primary: 'bg-emerald-600 hover:bg-emerald-700 text-white focus:ring-emerald-500 shadow-sm',
                accent: 'bg-amber-400 hover:bg-amber-500 text-slate-900 focus:ring-amber-400 shadow-sm',
                secondary: 'bg-slate-100 hover:bg-slate-200 text-slate-800 focus:ring-slate-300',
                outline: 'border-2 border-emerald-600 text-emerald-700 hover:bg-emerald-50 focus:ring-emerald-500',
                brand: 'bg-red-600 hover:bg-red-700 text-white focus:ring-red-500 shadow-sm',
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled || isLoading} className={`${baseStyles} ${variants[variant] || variants.primary} ${className}`}>
                    {isLoading ? (
                        <>
                            <svg className="animate-spin h-4 w-4 text-current" viewBox="0 0 24 24" fill="none">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                            </svg>
                            <span>Processing...</span>
                        </>
                    ) : children}
                </button>
            );
        }

        // Reusable Product Card Component
        function ProductCard({ product, onSelect, isSelected, onSetAlert }) {
            const { name, storeA, storeB, category } = product;
            const savings = Math.max(0, storeB - storeA);
            return (
                <div 
                    onClick={() => onSelect(product.id)}
                    className={`p-4 rounded-xl border cursor-pointer transition-all ${
                        isSelected ? 'border-emerald-600 bg-emerald-50/50 shadow-md ring-2 ring-emerald-500/20' : 'border-gray-200 hover:border-gray-300 bg-white shadow-sm'
                    }`}
                >
                    <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">{category}</span>
                        {savings > 0 && (
                            <span className="bg-emerald-100 text-emerald-800 font-bold text-xs px-2 py-0.5 rounded-full">
                                Save R{savings.toFixed(2)}
                            </span>
                        )}
                    </div>
                    <div className="flex items-center gap-3">
                        <input type="checkbox" checked={isSelected} onChange={() => {}} className="w-5 h-5 accent-emerald-600 rounded cursor-pointer" />
                        <h3 className="font-bold text-gray-800 text-base">{name}</h3>
                    </div>
                    <div className="mt-3 flex items-center justify-between text-sm pt-2 border-t border-gray-100">
                        <div>
                            <span className="text-gray-500">Pick n Cheaper: <strong className="text-emerald-700">R{storeA.toFixed(2)}</strong></span>
                            <span className="text-gray-400 line-through text-xs ml-2">Regular: R{storeB.toFixed(2)}</span>
                        </div>
                        <button 
                            type="button"
                            onClick={(e) => { e.stopPropagation(); onSetAlert(product); }}
                            className="text-xs font-bold text-red-600 hover:text-red-800 underline"
                        >
                            Price Alert
                        </button>
                    </div>
                </div>
            );
        }

        // Reusable Email Newsletter / Lead Capture Component
        function NewsletterCard({ title = 'Never Miss a Supermarket Deal!', subtitle = 'Get weekly price-drop alerts and exclusive grocery coupons delivered straight to your inbox.', variant = 'default' }) {
            const [email, setEmail] = useState('');
            const [status, setStatus] = useState('idle');

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!email) return;
                setStatus('loading');
                try {
                    await new Promise((res) => setTimeout(res, 800));
                    setStatus('success');
                    setEmail('');
                } catch {
                    setStatus('error');
                }
            };

            const isAccent = variant === 'accent';
            return (
                <div className={`p-6 rounded-xl border transition-all ${isAccent ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-red-800 border-red-700 text-white'}`}>
                    {status === 'success' ? (
                        <div className="text-center py-4 space-y-2">
                            <div className="text-3xl">🎉</div>
                            <h4 className="text-xl font-bold">You're on the list!</h4>
                            <p className="text-sm opacity-90">Check your inbox for your welcome savings pass and discount code.</p>
                        </div>
                    ) : (
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <h3 className="text-xl font-bold">{title}</h3>
                                <p className="text-sm opacity-90 mt-1">{subtitle}</p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-2">
                                <input
                                    type="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="Enter your email address"
                                    className="px-4 py-2.5 rounded-lg text-gray-900 bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-500 flex-1 text-sm"
                                />
                                <Button type="submit" variant={isAccent ? 'primary' : 'accent'} isLoading={status === 'loading'}>
                                    Get Deals
                                </Button>
                            </div>
                            {status === 'error' && <p className="text-xs text-red-300">Something went wrong. Please try again.</p>}
                        </form>
                    )}
                </div>
            );
        }

        // Price Alert Modal Component
        function PriceAlertModal({ product, isOpen, onClose }) {
            const [targetPrice, setTargetPrice] = useState('');
            const [email, setEmail] = useState('');
            const [submitted, setSubmitted] = useState(false);

            useEffect(() => {
                if (product) {
                    setTargetPrice(product.storeA);
                    setSubmitted(false);
                }
            }, [product]);

            if (!isOpen || !product) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
            };

            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative text-gray-800">
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold">✕</button>
                        {!submitted ? (
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <h3 className="text-xl font-bold text-gray-900">Set Price Alert</h3>
                                <p className="text-sm text-gray-600">We'll email you as soon as <strong>{product.name}</strong> drops to your target price.</p>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Target Price (R)</label>
                                    <input type="number" step="0.01" required value={targetPrice} onChange={(e) => setTargetPrice(e.target.value)} className="w-full px-3 py-2 border rounded-md text-gray-900 focus:ring-2 focus:ring-emerald-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Your Email</label>
                                    <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="name@example.com" className="w-full px-3 py-2 border rounded-md text-gray-900 focus:ring-2 focus:ring-emerald-500 outline-none" />
                                </div>
                                <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition">Notify Me When Price Drops</button>
                            </form>
                        ) : (
                            <div className="text-center py-6 space-y-3">
                                <div className="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
                                <h4 className="text-lg font-bold">Alert Created!</h4>
                                <p className="text-sm text-gray-600">We’ll email <strong>{email}</strong> when {product.name} drops below R{targetPrice}.</p>
                                <button onClick={onClose} className="mt-4 px-4 py-2 bg-gray-100 text-gray-700 font-semibold rounded-md hover:bg-gray-200">Back to Shopping</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Main Web Application Container
        function App() {
            const [selectedItems, setSelectedItems] = useState([1, 2]);
            const [alertProduct, setAlertProduct] = useState(null);
            const [activeCategory, setActiveCategory] = useState('All');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [spend, setSpend] = useState(4500);

            const toggleItem = (id) => {
                setSelectedItems((prev) => prev.includes(id) ? prev.filter((i) => i !== id) : [...prev, id]);
            };

            const totalStoreA = SAMPLE_PRODUCTS.filter((item) => selectedItems.includes(item.id)).reduce((sum, item) => sum + item.storeA, 0);
            const totalStoreB = SAMPLE_PRODUCTS.filter((item) => selectedItems.includes(item.id)).reduce((sum, item) => sum + item.storeB, 0);
            const totalSavings = Math.max(0, totalStoreB - totalStoreA);

            const monthlyCalcSavings = Math.round(spend * 0.18);
            const annualCalcSavings = monthlyCalcSavings * 12;

            const filteredProducts = activeCategory === 'All' 
                ? SAMPLE_PRODUCTS 
                : SAMPLE_PRODUCTS.filter(p => p.category === activeCategory);

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    <div>
                        <!-- Header Navigation -->
                        <header className="bg-white shadow-sm sticky top-0 z-40">
                            <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                                    <span className="bg-red-600 text-white font-black px-3 py-1.5 rounded-lg text-lg tracking-wider shadow">P n C</span>
                                    <div>
                                        <h1 className="text-xl font-extrabold text-red-600 tracking-tight leading-none">Pick n Cheaper</h1>
                                        <span className="text-xs text-gray-500 font-semibold tracking-wide uppercase">Supermarket</span>
                                    </div>
                                </div>
                                
                                <nav className="hidden md:flex items-center space-x-6 text-sm font-semibold text-gray-600">
                                    <a href="#home" className="hover:text-red-600 transition">Home</a>
                                    <a href="#products" className="hover:text-red-600 transition">Products & Services</a>
                                    <a href="#about" className="hover:text-red-600 transition">About Us</a>
                                    <a href="#contact" className="hover:text-red-600 transition">Contact & Leads</a>
                                </nav>

                                <div className="hidden md:block">
                                    <button 
                                        onClick={() => setAlertProduct(SAMPLE_PRODUCTS[0])}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-lg shadow transition"
                                    >
                                        Campaign Hub
                                    </button>
                                </div>

                                <button 
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)} 
                                    className="md:hidden text-gray-600 focus:outline-none p-2"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={mobileMenuOpen ? "M6 18L18 6M6 6l12 12" : "M4 6h16M4 12h16M4 18h16"} />
                                    </svg>
                                </button>
                            </div>

                            {mobileMenuOpen && (
                                <div className="md:hidden bg-white border-b border-gray-100 px-4 pt-2 pb-4 space-y-3 font-semibold text-gray-600">
                                    <a href="#home" onClick={() => setMobileMenuOpen(false)} className="block py-1 hover:text-red-600">Home</a>
                                    <a href="#products" onClick={() => setMobileMenuOpen(false)} className="block py-1 hover:text-red-600">Products & Services</a>
                                    <a href="#about" onClick={() => setMobileMenuOpen(false)} className="block py-1 hover:text-red-600">About Us</a>
                                    <a href="#contact" onClick={() => setMobileMenuOpen(false)} className="block py-1 hover:text-red-600">Contact & Leads</a>
                                    <button 
                                        onClick={() => { setMobileMenuOpen(false); setAlertProduct(SAMPLE_PRODUCTS[0]); }}
                                        className="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg text-sm"
                                    >
                                        Campaign Hub
                                    </button>
                                </div>
                            )}
                        </header>

                        <!-- Hero Banner Section -->
                        <section id="home" className="bg-gradient-to-b from-red-600 to-red-700 text-white py-16 px-4">
                            <div className="max-w-4xl mx-auto text-center space-y-4">
                                <h2 className="text-3xl md:text-5xl font-black tracking-tight">Quality Groceries at Unbeatable Prices</h2>
                                <p className="text-red-100 text-base md:text-lg max-w-2xl mx-auto">
                                    Directly sourced fresh produce, daily baked goods, and household essentials designed for your family budget.
                                </p>
                                <div className="pt-4 flex flex-wrap justify-center gap-4">
                                    <a href="#products" className="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-6 py-3 rounded-lg shadow transition">
                                        Shop Special Categories
                                    </a>
                                    <button onClick={() => setAlertProduct(SAMPLE_PRODUCTS[0])} className="bg-white/10 hover:bg-white/20 border border-white/30 text-white font-bold px-6 py-3 rounded-lg transition">
                                        Claim Voucher
                                    </button>
                                </div>
                            </div>
                        </section>

                        <!-- Main Content Container -->
                        <main className="max-w-4xl mx-auto px-4 -mt-8 mb-16 relative z-10 space-y-8">
                            
                            <!-- Mini Savings Calculator -->
                            <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8">
                                <div className="text-center mb-6">
                                    <span className="text-xs font-bold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">Interactive Tool</span>
                                    <h3 className="text-2xl font-bold text-gray-900 mt-2">Mini Savings Calculator</h3>
                                    <p className="text-sm text-gray-500 mt-1">See how much you can save every month by switching your primary grocery shopping to Pick n Cheaper.</p>
                                </div>

                                <div className="grid md:grid-cols-2 gap-8 items-center">
                                    <div className="space-y-6">
                                        <div>
                                            <div className="flex justify-between items-center mb-2">
                                                <label className="text-sm font-semibold text-gray-700">Current Monthly Grocery Spend (ZAR):</label>
                                                <span className="text-lg font-bold text-red-600">R {spend.toLocaleString()}</span>
                                            </div>
                                            <input 
                                                type="range" 
                                                min="1000" 
                                                max="15000" 
                                                step="250" 
                                                value={spend} 
                                                onChange={(e) => setSpend(parseInt(e.target.value))}
                                                className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-red-600"
                                            />
                                            <div className="flex justify-between text-xs text-gray-400 mt-1">
                                                <span>R 1,000</span>
                                                <span>R 7,500</span>
                                                <span>R 15,000+</span>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Household Size:</label>
                                            <select className="w-full px-3 py-2 border rounded-lg text-gray-800 bg-white focus:ring-2 focus:ring-red-500 outline-none">
                                                <option>Single Shopper</option>
                                                <option>Couple (2 People)</option>
                                                <option defaultValue>Family Household (3-4 People)</option>
                                                <option>Large Household (5+ People)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-6 text-center space-y-4">
                                        <span className="text-xs font-bold text-emerald-700 uppercase tracking-wide">Estimated Grocery Savings</span>
                                        <div>
                                            <p className="text-xs text-emerald-600 font-medium">Monthly Savings</p>
                                            <h4 className="text-3xl font-black text-emerald-700">R {monthlyCalcSavings.toLocaleString()}</h4>
                                        </div>
                                        <div className="border-t border-emerald-200/60 pt-3">
                                            <p className="text-xs text-emerald-600 font-medium">Estimated Annual Savings</p>
                                            <h5 className="text-xl font-bold text-emerald-800">R {annualCalcSavings.toLocaleString()}</h5>
                                        </div>
                                        <p className="text-[11px] text-gray-500 italic">*Based on average 18% price comparison against traditional national supermarkets.</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Smart Basket Calculator -->
                            <div className="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8 space-y-6">
                                <div className="border-b pb-4">
                                    <h3 className="text-2xl font-bold text-gray-900">🛒 Smart Basket Savings Calculator</h3>
                                    <p className="text-sm text-gray-500 mt-1">Select items to calculate your live total savings between competing stores.</p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {SAMPLE_PRODUCTS.map((product) => (
                                        <ProductCard
                                            key={product.id}
                                            product={product}
                                            isSelected={selectedItems.includes(product.id)}
                                            onSelect={toggleItem}
                                            onSetAlert={(prod) => setAlertProduct(prod)}
                                        />
                                    ))}
                                </div>

                                <div className="bg-slate-900 text-white rounded-xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
                                    <div>
                                        <p className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Total Basket Savings</p>
                                        <p className="text-3xl font-extrabold text-amber-400 mt-0.5">R{totalSavings.toFixed(2)}</p>
                                    </div>
                                    <div className="text-right text-xs text-slate-300 space-y-1">
                                        <p>Pick n Cheaper: <strong className="text-white">R{totalStoreA.toFixed(2)}</strong></p>
                                        <p>Regular Competitors: <strong className="text-white">R{totalStoreB.toFixed(2)}</strong></p>
                                    </div>
                                </div>

                                <NewsletterCard
                                    title="Save this Basket & Get Price Alerts"
                                    subtitle="We will monitor these items and email you when prices drop even lower."
                                    variant="accent"
                                />
                            </div>

                            <!-- Products Section -->
                            <section id="products" className="bg-white rounded-2xl shadow-md border border-gray-100 p-6 md:p-8 space-y-6">
                                <div className="text-center">
                                    <h3 className="text-2xl font-bold text-gray-900">Products & Special Categories</h3>
                                    <p className="text-sm text-gray-500 mt-1">Explore our featured weekly specials and price drops.</p>
                                </div>

                                <div className="flex justify-center space-x-2 border-b pb-4">
                                    {['All', 'Cheaper Staples', 'Fresh Harvest'].map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setActiveCategory(cat)}
                                            className={`px-4 py-2 rounded-lg font-bold text-xs transition ${activeCategory === cat ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {filteredProducts.map(product => (
                                        <ProductCard
                                            key={product.id}
                                            product={product}
                                            isSelected={selectedItems.includes(product.id)}
                                            onSelect={toggleItem}
                                            onSetAlert={(prod) => setAlertProduct(prod)}
                                        />
                                    ))}
                                </div>
                            </section>

                            <!-- About Us Section -->
                            <section id="about" className="bg-white rounded-2xl shadow-md border border-gray-100 p-6 md:p-8 space-y-4">
                                <h3 className="text-2xl font-bold text-gray-900 border-b pb-2">About Pick n Cheaper</h3>
                                <p className="text-sm text-gray-600 leading-relaxed">
                                    Pick n Cheaper is dedicated to helping South African families stretch their grocery budgets further. By working directly with local farmers and suppliers, we deliver top-tier fresh produce, bakery goods, and household staples at unbeatable prices.
                                </p>
                            </section>

                            <!-- Contact Section -->
                            <section id="contact" className="bg-white rounded-2xl shadow-md border border-gray-100 p-6 md:p-8 space-y-4">
                                <h3 className="text-2xl font-bold text-gray-900 border-b pb-2">Contact & Support</h3>
                                <p className="text-sm text-gray-600">Have questions or want to reach out to our customer support team?</p>
                                <form onSubmit={(e) => { e.preventDefault(); alert('Message Sent!'); }} className="space-y-3">
                                    <input type="text" required placeholder="Your Name" className="w-full px-3 py-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-red-500" />
                                    <input type="email" required placeholder="Your Email Address" className="w-full px-3 py-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-red-500" />
                                    <textarea required rows="3" placeholder="How can we help you?" className="w-full px-3 py-2 border rounded-md text-sm outline-none focus:ring-2 focus:ring-red-500"></textarea>
                                    <Button type="submit" variant="brand" className="w-full">Send Message</Button>
                                </form>
                            </section>

                            <!-- Campaign Hub Section -->
                            <section id="campaign">
                                <NewsletterCard />
                            </section>
                        </main>
                    </div>

                    <!-- Footer -->
                    <footer className="bg-gray-900 text-gray-400 py-8 text-center text-sm">
                        <p>&copy; 2026 Pick n Cheaper Supermarket. All rights reserved.</p>
                    </footer>

                    <!-- Price Alert Modal -->
                    <PriceAlertModal
                        product={alertProduct}
                        isOpen={Boolean(alertProduct)}
                        onClose={() => setAlertProduct(null)}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
